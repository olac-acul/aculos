# aculOs: sshd (off by default, turned on with "aculos-ssh on") accepts only keys and never root.
# Read before 50-redhat.conf: in sshd the first value read wins.
# aculos-ssh writes the VPN listen address under /run, so it is gone after a reboot.
Include /run/aculos-ssh/*.conf
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
