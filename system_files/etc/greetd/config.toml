# greetd di aculOs: login grafico con noctalia-greeter.
# greetd lancia il wrapper noctalia-greeter-session, che avvia il compositor del greeter e il greeter.
[terminal]
vt = 1

[default_session]
command = "/usr/bin/noctalia-greeter-session"
# Utente di sistema creato dal pacchetto greetd di Fedora (sysusers)
user = "greetd"
