# aculOs greetd: graphical login with noctalia-greeter.
# greetd runs the noctalia-greeter-session wrapper, which starts the greeter's compositor and the greeter.
[terminal]
vt = 1

[default_session]
command = "/usr/bin/noctalia-greeter-session"
# System user created by Fedora's greetd package (sysusers)
user = "greetd"
