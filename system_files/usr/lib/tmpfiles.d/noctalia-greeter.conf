# Cartella di stato di noctalia-greeter, dell'utente del greeter (greetd su Fedora)
d /var/lib/noctalia-greeter 0750 greetd greetd -
# Etichetta SELinux dei display manager (regola aggiunta in build.sh): "Z" la mette anche ai file che ci sono già,
# altrimenti il greeter non può sostituire sync.toml (visto in VM il 23/11).
Z /var/lib/noctalia-greeter - - - -
