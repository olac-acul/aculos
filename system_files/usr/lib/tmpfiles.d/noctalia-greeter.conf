# noctalia-greeter state folder, owned by the greeter user (greetd on Fedora)
d /var/lib/noctalia-greeter 0750 greetd greetd -
# Display manager SELinux label (rule added in build.sh): "Z" applies it to the files already there too,
# otherwise the greeter cannot replace sync.toml (seen in the VM on Nov 23).
Z /var/lib/noctalia-greeter - - - -
