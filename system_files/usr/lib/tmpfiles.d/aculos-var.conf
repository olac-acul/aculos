# Folders in /var that the packages install with the RPM: in a bootc image /var is populated only at the first
# install, so they are declared here (permissions as in the packages).
d /var/lib/fprint 0700 root root -
d /var/lib/tailscale 0600 root root -
d /var/lib/tuned 0755 root root -
# /var/log is a cache during the build, so tuned's log folder does not come from the image. If tuned creates it at
# boot it has the wrong SELinux label and tuned-ppd cannot write to it (seen in the VM on Nov 23): "Z" relabels it
# even when it already exists.
d /var/log/tuned 0755 root root -
Z /var/log/tuned - - - -
