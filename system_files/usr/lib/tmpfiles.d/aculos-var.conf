# Cartelle in /var che i pacchetti installano con l'RPM: in un'immagine bootc /var si popola solo alla prima
# installazione, quindi le si dichiara qui (permessi come nei pacchetti).
d /var/lib/fprint 0700 root root -
d /var/lib/tailscale 0600 root root -
d /var/lib/tuned 0755 root root -
# /var/log durante la build è una cache, quindi la cartella dei log di tuned non arriva dall'immagine. Se la crea
# tuned all'avvio ha l'etichetta SELinux sbagliata e tuned-ppd non può scriverci (visto in VM il 23/11): "Z" la
# rietichetta anche quando c'è già.
d /var/log/tuned 0755 root root -
Z /var/log/tuned - - - -
