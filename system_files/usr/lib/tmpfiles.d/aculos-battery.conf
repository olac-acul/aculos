# Battery charge thresholds: charging starts below 80% and stops at 85%.
# "w" writes only if the file exists (on a PC without a battery or without thresholds it does nothing).
# ThinkPad firmware keeps them across reboots.
w /sys/class/power_supply/BAT0/charge_control_end_threshold - - - - 85
w /sys/class/power_supply/BAT0/charge_control_start_threshold - - - - 80
