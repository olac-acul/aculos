# Soglie di carica della batteria: la carica parte sotto l'80% e si ferma all'85%.
# "w" scrive solo se il file esiste (su un PC senza batteria o senza soglie non fa niente).
# Il firmware dei ThinkPad le conserva anche dopo il riavvio.
w /sys/class/power_supply/BAT0/charge_control_end_threshold - - - - 85
w /sys/class/power_supply/BAT0/charge_control_start_threshold - - - - 80
