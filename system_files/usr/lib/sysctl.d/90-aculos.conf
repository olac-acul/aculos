# aculOs (from cachyos-settings), tuned for swap on zram
# swapping to zram is cheap: let the kernel use it rather than drop the file cache
vm.swappiness = 100
# zram has no seek time: read single pages, not clusters of 8
vm.page-cluster = 0
# keep the caches of directories and inodes longer
vm.vfs_cache_pressure = 50
# write dirty pages earlier and in smaller batches: fewer stalls on large writes
vm.dirty_ratio = 10
vm.dirty_background_ratio = 3
# the NMI watchdog costs power and is only for debugging hard lockups
kernel.nmi_watchdog = 0
