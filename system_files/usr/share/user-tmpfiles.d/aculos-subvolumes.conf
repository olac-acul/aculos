# aculOs: folders of the home that change all the time and can be rebuilt are btrfs subvolumes of their own, so
# the hourly snapshots of /var/home leave them out. "v" creates the subvolume only when the folder does not exist
# yet (a new user, or a home restored from the backup); an existing folder stays as it is.
v %h/.cache 0700 - - -
v %h/.local/share/containers 0700 - - -
