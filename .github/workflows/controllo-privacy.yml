---
name: Controllo privacy
# Cerca nel repo le parole che non devono essere pubbliche. L'elenco sta nel segreto PAROLE_VIETATE
# (una espressione regolare estesa per riga), così non compare nel repo. Stampa solo file e riga, mai il testo.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controllo:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Cerca le parole vietate
        env:
          PAROLE_VIETATE: ${{ secrets.PAROLE_VIETATE }}
        run: |
          set -euo pipefail
          if [ -z "${PAROLE_VIETATE}" ]; then
            echo "::error::Manca il segreto PAROLE_VIETATE"
            exit 1
          fi
          elenco="$(mktemp)"
          printf '%s\n' "${PAROLE_VIETATE}" | grep -v -e '^#' -e '^[[:space:]]*$' > "${elenco}"
          trovato=0
          # File attuali
          if git grep -n -I -E -f "${elenco}" -- . > /tmp/risultati; then
            cut -d: -f1,2 /tmp/risultati | sed 's/^/::error::parola vietata in /'
            trovato=1
          fi
          # Messaggi ed email dei commit (i nomi no: il primo commit del template porta il nome dell'account)
          if git log --format='%ae %ce%n%B' | grep -q -E -f "${elenco}"; then
            echo "::error::parola vietata in un messaggio o in un'email di commit"
            trovato=1
          fi
          exit "${trovato}"
